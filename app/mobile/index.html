<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BP-Contact | Notifications</title>
    <style>
        :root {
            --bg-main: #1e1f22;
            --bg-sidebar: #2b2d31;
            --bg-chat: #313338;
            --accent: #5865f2;
            --msg-me: #5865f2;
            --msg-friend: #383a40;
            --text-main: #dbdee1;
            --text-muted: #949ba4;
            --online: #23a559;
            --danger: #ed4245;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg-main); color: var(--text-main); overflow: hidden; position: fixed; }
        
        .app-container { display: flex; height: 100vh; width: 100vw; }

        /* Sidebar Navigation */
        .side-panels { display: flex; height: 100%; transition: transform 0.3s ease; z-index: 1000; flex-shrink: 0; }
        .contacts-bar { width: 72px; background: var(--bg-main); display: flex; flex-direction: column; align-items: center; padding-top: 15px; gap: 12px; }
        .bp-logo { width: 48px; height: 48px; background: var(--accent); border-radius: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; color: white; }
        .contact-circle { width: 48px; height: 48px; background: var(--bg-sidebar); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .sidebar-info { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid #1e1f22; }

        /* Main Content Area */
        .main-content { flex: 1; position: relative; height: 100%; background: var(--bg-chat); display: flex; flex-direction: column; min-width: 0; }

        /* Dashboard & Pages Look */
        .scroll-page { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .contact-card { 
            background: white; border-radius: 20px; padding: 15px 20px; color: #333; 
            display: flex; align-items: center; gap: 15px; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer; transition: transform 0.1s;
        }
        .contact-card:active { transform: scale(0.98); }
        .user-icon-wrap { width: 50px; height: 50px; background: #444; border-radius: 50%; position: relative; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; flex-shrink: 0; }
        .status-dot { position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; }
        .status-dot.online { background: var(--online); }
        .status-dot.offline { background: #808080; }
        .user-name-big { font-size: 22px; color: #1e1f22; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Chat System */
        #chatPage { display: none; flex-direction: column; height: 100%; position: relative; background: var(--bg-chat); }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .bubble { 
            padding: 12px 16px; border-radius: 18px; font-size: 15px; 
            overflow-wrap: break-word; word-wrap: break-word; word-break: break-word; 
            max-width: 90%; line-height: 1.4; color: white;
        }

        /* Barre de chat FIXE */
        .chat-input-area { 
            padding: 15px; background: var(--bg-chat); border-top: 1px solid #26272d;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }
        .input-wrap { background: #383a40; border-radius: 12px; padding: 5px 15px; display: flex; align-items: center; gap: 10px; }
        #userInput { background: transparent; border: none; color: white; flex: 1; outline: none; font-size: 16px; height: 40px; }
        #sendBtn { background: var(--accent); color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Overlays & Modals */
        .overlay-full { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        #seeMoreOverlay { position: absolute; inset: 0; background: var(--bg-chat); z-index: 100; display: none; flex-direction: column; padding: 20px; }
        .auth-card { background: var(--bg-sidebar); padding: 25px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; color: white; }
        
        .hamburger { background: none; border: none; color: white; font-size: 28px; cursor: pointer; margin-right: 15px; }
        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .side-panels { position: absolute; transform: translateX(-100%); width: 300px; height: 100%; }
            .side-panels.open { transform: translateX(0); }
        }
    </style>
</head>
<body onclick="hideCtx()">

    <div id="ctxMenu" style="position:fixed; background:#111214; border-radius:8px; padding:8px; z-index:9000; display:none; width:150px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
        <div onclick="editMsg()" style="padding:10px; cursor:pointer; color:white;">Modifier</div>
        <div onclick="deleteMsg()" style="padding:10px; cursor:pointer; color:var(--danger);">Supprimer</div>
    </div>

    <div id="loginOverlay" class="overlay-full">
        <div class="auth-card">
            <h2 style="margin-bottom:20px;">BlocPlay</h2>
            <input type="email" id="email" placeholder="Email" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:none; background:#1e1f22; color:white;">
            <input type="password" id="pass" placeholder="Mot de passe" style="width:100%; padding:12px; margin-bottom:20px; border-radius:8px; border:none; background:#1e1f22; color:white;">
            <button id="loginBtn" style="width:100%; padding:12px; background:var(--accent); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">CONNEXION</button>
        </div>
    </div>

    <div id="addModal" class="overlay-full hidden">
        <div class="auth-card">
            <h3>Ajouter un ami</h3>
            <input type="email" id="friendEmail" placeholder="Email exact" style="width:100%; padding:12px; border-radius:8px; border:none; background:#1e1f22; color:white;">
            <button id="sendInviteBtn" style="width:100%; margin-top:15px; padding:12px; background:var(--accent); color:white; border:none; border-radius:8px; font-weight:bold;">Envoyer l'invitation</button>
            <button onclick="document.getElementById('addModal').classList.add('hidden')" style="background:none; border:none; color:var(--text-muted); margin-top:15px; cursor:pointer;">Annuler</button>
        </div>
    </div>

    <div class="app-container">
        <div class="side-panels" id="sidePanels">
            <nav class="contacts-bar">
                <div class="bp-logo" onclick="showHome()">BP</div>
                <div id="iconsList" style="display:contents;"></div>
                <div class="contact-circle" style="color:var(--online); border:2px dashed #444; font-size:24px;" onclick="document.getElementById('addModal').classList.remove('hidden')">+</div>
            </nav>
            <aside class="sidebar-info">
                <div style="padding:20px; font-weight:bold; border-bottom:1px solid #1e1f22;">DEMANDES</div>
                <div id="requestsList" style="padding:10px; flex:1; overflow-y:auto;"></div>
                <button onclick="auth.signOut().then(()=>location.reload())" style="padding:20px; color:var(--danger); background:none; border:none; text-align:left; cursor:pointer; font-weight:bold;">DÉCONNEXION</button>
            </aside>
        </div>

        <div class="main-content">
            <div id="homePage" class="scroll-page">
                <div style="display:flex; align-items:center; font-size:24px; color:white; font-weight:bold;">
                    <button class="hamburger" onclick="toggleMenu()">☰</button> Accueil
                </div>
                <section>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span id="onLabel" style="font-weight:bold;">En ligne (0) :</span>
                        <span style="color:var(--accent); cursor:pointer; font-size:14px;" onclick="openSeeMore('online')">Voir plus ></span>
                    </div>
                    <div id="onPreview"></div>
                </section>
                <section>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span id="offLabel" style="font-weight:bold;">Hors ligne (0) :</span>
                        <span style="color:var(--accent); cursor:pointer; font-size:14px;" onclick="openSeeMore('offline')">Voir plus ></span>
                    </div>
                    <div id="offPreview"></div>
                </section>
            </div>

            <div id="chatPage">
                <header style="height:60px; padding:0 15px; display:flex; align-items:center; border-bottom:1px solid #26272d;">
                    <button class="hamburger" onclick="toggleMenu()">☰</button>
                    <span id="chatTitle" style="font-weight:bold; font-size:18px;">Pseudo</span>
                </header>
                <div id="messages"></div>
                <div class="chat-input-area">
                    <div class="input-wrap">
                        <input type="text" id="userInput" placeholder="Écrire un message...">
                        <button id="sendBtn">➤</button>
                    </div>
                </div>
            </div>

            <div id="seeMoreOverlay">
                <div style="display:flex; align-items:center; margin-bottom:20px;">
                    <button class="hamburger" onclick="toggleMenu()">☰</button>
                    <span id="seeMoreTitle" style="font-size:22px; font-weight:bold;">Liste</span>
                    <button onclick="closeSeeMore()" style="margin-left:auto; background:none; border:none; color:var(--accent); font-weight:bold; font-size:16px;">Fermer</button>
                </div>
                <div id="seeMoreGrid" style="display:flex; flex-direction:column; gap:12px; overflow-y:auto;"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, query, orderByChild, equalTo, remove, update, onDisconnect, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
            authDomain: "blocplay-a9417.firebaseapp.com",
            databaseURL: "https://blocplay-a9417-default-rtdb.firebaseio.com",
            projectId: "blocplay-a9417",
            storageBucket: "blocplay-a9417.firebasestorage.app",
            messagingSenderId: "540161549188",
            appId: "1:540161549188:web:ffe799fa3747cb42f333d1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        let myId = null, activeChatId = null, contactsData = [], selectedMsgId = null;
        const activeListeners = new Set();

        // Demander l'autorisation de notification
        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }

        function triggerNotification(senderName, messageText) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(`Message de ${senderName}`, {
                    body: messageText,
                    icon: "https://via.placeholder.com/128/5865f2/ffffff?text=BP"
                });
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                myId = user.uid;
                const uRef = ref(db, `users/${myId}`);
                await update(uRef, { uid: myId, email: user.email.toLowerCase(), displayName: user.email.split('@')[0], status: "online" });
                onDisconnect(uRef).update({ status: "offline" });
                document.getElementById('loginOverlay').classList.add('hidden');
                requestNotificationPermission();
                loadContacts(); loadRequests();
            } else { 
                document.getElementById('loginOverlay').classList.remove('hidden'); 
            }
        });

        window.toggleMenu = () => document.getElementById('sidePanels').classList.toggle('open');
        window.showHome = () => {
            document.getElementById('homePage').style.display = 'flex';
            document.getElementById('chatPage').style.display = 'none';
            document.getElementById('seeMoreOverlay').style.display = 'none';
            document.getElementById('sidePanels').classList.remove('open');
            activeChatId = null;
        };

        function loadContacts() {
            onValue(ref(db, `contacts/${myId}`), (snap) => {
                const iList = document.getElementById('iconsList'); iList.innerHTML = "";
                contactsData = [];
                snap.forEach(c => {
                    const fid = c.val().uid;
                    onValue(ref(db, `users/${fid}`), (uSnap) => {
                        const data = uSnap.val(); if(!data) return;
                        contactsData = contactsData.filter(u => u.uid !== fid);
                        contactsData.push(data);
                        
                        const icon = document.createElement('div');
                        icon.className = "contact-circle"; icon.innerText = data.displayName[0];
                        icon.onclick = () => openChat(fid, data.displayName);
                        iList.appendChild(icon);
                        refreshDashboard();
                        
                        // Écouteur de notifications d'arrière-plan pour ce contact
                        listenForNotifications(fid, data.displayName);
                    });
                });
            });
        }

        function listenForNotifications(friendId, friendName) {
            const ids = [myId, friendId].sort();
            const chatId = ids[0] + "_" + ids[1];
            
            if (activeListeners.has(chatId)) return;
            activeListeners.add(chatId);

            let initialLoad = true;
            const chatRef = query(ref(db, `chats/${chatId}`), limitToLast(1));
            
            onValue(chatRef, (snap) => {
                if (initialLoad) {
                    initialLoad = false;
                    return;
                }
                
                snap.forEach(m => {
                    const msg = m.val();
                    // Envoyer notification si le message ne vient pas de moi ET (on n'est pas sur ce chat OU l'onglet est en arrière-plan)
                    if (msg.authorUid !== myId && (activeChatId !== chatId || document.hidden)) {
                        triggerNotification(friendName, msg.text);
                    }
                });
            });
        }

        function refreshDashboard() {
            const onArr = contactsData.filter(u => u.status === 'online');
            const offArr = contactsData.filter(u => u.status === 'offline');
            document.getElementById('onLabel').innerText = `En ligne (${onArr.length}) :`;
            document.getElementById('offLabel').innerText = `Hors ligne (${offArr.length}) :`;

            const cardHtml = (u) => `<div class="contact-card" onclick="openChat('${u.uid}', '${u.displayName}')"><div class="user-icon-wrap">${u.displayName[0]}<div class="status-dot ${u.status}"></div></div><div class="user-name-big">${u.displayName}</div></div>`;
            document.getElementById('onPreview').innerHTML = onArr.length ? cardHtml(onArr[0]) : "";
            document.getElementById('offPreview').innerHTML = offArr.length ? cardHtml(offArr[0]) : "";
        }

        window.openChat = (fid, fname) => {
            const ids = [myId, fid].sort();
            activeChatId = ids[0] + "_" + ids[1];
            document.getElementById('chatTitle').innerText = fname;
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('chatPage').style.display = 'flex';
            document.getElementById('seeMoreOverlay').style.display = 'none';
            document.getElementById('sidePanels').classList.remove('open');
            
            onValue(ref(db, `chats/${activeChatId}`), (snap) => {
                const mDiv = document.getElementById('messages'); mDiv.innerHTML = "";
                snap.forEach(m => {
                    const isMe = m.val().authorUid === myId;
                    const wrap = document.createElement('div');
                    wrap.style = `display:flex; flex-direction:column; max-width:100%; align-self:${isMe?'flex-end':'flex-start'}; align-items:${isMe?'flex-end':'flex-start'}`;
                    wrap.innerHTML = `<div class="bubble" oncontextmenu="showCtx(event, '${m.key}', ${isMe})" style="background:${isMe?'var(--msg-me)':'var(--msg-friend)'}; border-radius:18px; border-bottom-${isMe?'right':'left'}-radius:4px;">${m.val().text}</div>`;
                    mDiv.appendChild(wrap);
                });
                mDiv.scrollTop = mDiv.scrollHeight;
            });
        };

        window.openSeeMore = (type) => {
            const grid = document.getElementById('seeMoreGrid'); grid.innerHTML = "";
            document.getElementById('seeMoreOverlay').style.display = 'flex';
            document.getElementById('seeMoreTitle').innerText = type === 'online' ? "Amis en ligne" : "Amis hors ligne";
            contactsData.filter(c => c.status === type).forEach(c => {
                grid.innerHTML += `<div class="contact-card" onclick="openChat('${c.uid}', '${c.displayName}')"><div class="user-icon-wrap">${c.displayName[0]}<div class="status-dot ${c.status}"></div></div><div class="user-name-big">${c.displayName}</div></div>`;
            });
        };
        window.closeSeeMore = () => document.getElementById('seeMoreOverlay').style.display = 'none';

        function loadRequests() {
            onValue(ref(db, `requests/${myId}`), (snap) => {
                const rList = document.getElementById('requestsList'); rList.innerHTML = "";
                snap.forEach(c => {
                    rList.innerHTML += `<div style="padding:12px; background:#383a40; border-radius:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; font-size:14px;"><span>${c.val().fromName}</span><button onclick="acceptInvite('${c.key}')" style="background:var(--online); color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:bold;">OK</button></div>`;
                });
            });
        }

        window.acceptInvite = async (fid) => {
            await set(ref(db, `contacts/${myId}/${fid}`), { uid: fid });
            await set(ref(db, `contacts/${fid}/${myId}`), { uid: myId });
            await remove(ref(db, `requests/${myId}/${fid}`));
        };

        document.getElementById('sendBtn').onclick = () => {
            const val = document.getElementById('userInput').value.trim();
            if(val && activeChatId) push(ref(db, `chats/${activeChatId}`), { authorUid: myId, text: val });
            document.getElementById('userInput').value = "";
        };

        document.getElementById('loginBtn').onclick = () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert("Erreur : " + err.message));
        };

        document.getElementById('sendInviteBtn').onclick = async () => {
            const email = document.getElementById('friendEmail').value.trim().toLowerCase();
            const q = query(ref(db, 'users'), orderByChild('email'), equalTo(email));
            const snap = await get(q);
            if(snap.exists()){
                const tid = Object.keys(snap.val())[0];
                const me = await get(ref(db, `users/${myId}`));
                await set(ref(db, `requests/${tid}/${myId}`), { fromUid: myId, fromName: me.val().displayName });
                alert("Demande envoyée !"); document.getElementById('addModal').classList.add('hidden');
            } else alert("Utilisateur non trouvé.");
        };

        // Context Menu Functions
        window.showCtx = (e, mid, isMe) => { if(!isMe) return; e.preventDefault(); selectedMsgId = mid; const m = document.getElementById('ctxMenu'); m.style.display='block'; m.style.left=e.pageX+'px'; m.style.top=e.pageY+'px'; };
        window.hideCtx = () => document.getElementById('ctxMenu').style.display='none';
        window.deleteMsg = () => remove(ref(db, `chats/${activeChatId}/${selectedMsgId}`));
        window.editMsg = () => { const t = prompt("Nouveau message :"); if(t) update(ref(db, `chats/${activeChatId}/${selectedMsgId}`), { text: t + " (modifié)" }); };
    </script>
</body>
</html>
