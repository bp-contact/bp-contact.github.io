<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BlocPlay | Mobile App</title>
    <style>
        :root {
            --bg-main: #0f1012;
            --bg-sidebar: #18191c;
            --bg-chat: #1e1f22;
            --bg-card: #2b2d31;
            --accent: #5865f2;
            --msg-me: #5865f2;
            --msg-friend: #2b2d31;
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
            --online: #23a559;
            --danger: #ed4245;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body, html { height: 100%; width: 100%; background: #000; color: var(--text-main); overflow: hidden; position: fixed; }
        
        /* Conteneur App Style Mobile */
        .app-container { 
            display: flex; height: 100dvh; width: 100vw; max-width: 480px; margin: 0 auto; 
            background: var(--bg-main); position: relative; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* Sidebar Navigation Mobile Slider */
        .side-panels { 
            position: absolute; inset: 0; display: flex; z-index: 2000; 
            transform: translateX(-100%); transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .side-panels.open { transform: translateX(0); }
        .contacts-bar { width: 68px; background: var(--bg-main); display: flex; flex-direction: column; align-items: center; padding-top: 15px; gap: 12px; border-right: 1px solid #18191c; }
        .bp-logo { width: 44px; height: 44px; background: var(--accent); border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 800; color: white; font-size: 18px; }
        .contact-circle { width: 44px; height: 44px; background: var(--bg-card); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .sidebar-info { flex: 1; background: var(--bg-sidebar); display: flex; flex-direction: column; }

        /* Main Content Area */
        .main-content { flex: 1; position: relative; height: 100%; background: var(--bg-chat); display: flex; flex-direction: column; width: 100%; }

        /* Dashboard & Cards Look */
        .scroll-page { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
        .contact-card { 
            background: var(--bg-card); border-radius: 16px; padding: 14px 16px; color: var(--text-main); 
            display: flex; align-items: center; gap: 14px; margin-top: 8px; cursor: pointer; transition: background 0.15s, transform 0.1s;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .contact-card:active { transform: scale(0.98); background: #313338; }
        .user-icon-wrap { width: 46px; height: 46px; background: #404249; border-radius: 50%; position: relative; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; flex-shrink: 0; }
        .status-dot { position: absolute; bottom: 0; right: 0; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--bg-card); }
        .status-dot.online { background: var(--online); }
        .status-dot.offline { background: #808080; }
        .user-name-big { font-size: 17px; color: var(--text-main); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Chat UI */
        #chatPage { display: none; flex-direction: column; height: 100%; position: relative; background: var(--bg-chat); }
        #messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .bubble { 
            padding: 10px 14px; border-radius: 18px; font-size: 15px; 
            overflow-wrap: break-word; word-wrap: break-word; word-break: break-word; 
            max-width: 82%; line-height: 1.4; color: white;
        }

        /* Barre de saisie style iOS / Android */
        .chat-input-area { 
            padding: 10px 12px; background: var(--bg-sidebar); border-top: 1px solid rgba(255,255,255,0.05);
            padding-bottom: calc(10px + env(safe-area-inset-bottom)); position: relative;
        }
        .input-wrap { background: #2b2d31; border-radius: 24px; padding: 4px 6px 4px 14px; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.08); }
        #userInput { background: transparent; border: none; color: white; flex: 1; outline: none; font-size: 15px; height: 38px; }
        
        /* Boutons d'action */
        .icon-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: color 0.15s; }
        .icon-btn:active { color: white; background: rgba(255,255,255,0.1); }
        #sendBtn { background: var(--accent); color: white; border: none; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }

        /* Clavier Émoji Popup */
        #emojiPicker { 
            position: absolute; bottom: calc(100% + 8px); left: 10px; right: 10px; 
            background: #25272b; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); 
            display: none; flex-direction: column; height: 260px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 3000; overflow: hidden;
        }
        #emojiGrid { flex: 1; padding: 10px; overflow-y: auto; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .emoji-item { font-size: 22px; cursor: pointer; padding: 6px; border-radius: 8px; user-select: none; transition: transform 0.1s; }
        .emoji-item:active { transform: scale(1.3); background: rgba(255,255,255,0.1); }
        .emoji-search-bar { padding: 8px 10px; background: #1b1c1e; border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 8px; }
        #emojiSearch { flex: 1; background: #2b2d31; border: none; color: white; padding: 8px 12px; border-radius: 12px; font-size: 13px; outline: none; }

        /* Overlays & Modals Mobile */
        .overlay-full { position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 5000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); padding: 20px; }
        #seeMoreOverlay { position: absolute; inset: 0; background: var(--bg-chat); z-index: 1500; display: none; flex-direction: column; padding: 16px; }
        .auth-card { background: var(--bg-sidebar); padding: 22px; border-radius: 24px; width: 100%; max-width: 320px; text-align: center; color: white; border: 1px solid rgba(255,255,255,0.08); }
        
        .hamburger { background: none; border: none; color: white; font-size: 24px; cursor: pointer; margin-right: 12px; }
        .hidden { display: none !important; }
    </style>
</head>

        // Charger la grille d'émojis
        window.renderEmojis = (filter = "") => {
            const grid = document.getElementById('emojiGrid');
            grid.innerHTML = "";
            const cleanFilter = filter.toLowerCase().trim();
            
            emojiList.forEach(item => {
                if (!cleanFilter || item.k.includes(cleanFilter) || item.e.includes(cleanFilter)) {
                    const span = document.createElement('span');
                    span.className = 'emoji-item';
                    span.innerText = item.e;
                    span.onclick = () => {

                        input.value += item.e;
                        input.focus();
                    };
                    grid.appendChild(span);
                }
            });
        };

        window.filterEmojis = (val) => renderEmojis(val);

        window.toggleEmojiPicker = (e) => {
            e.stopPropagation();
            const picker = document.getElementById('emojiPicker');
            const isHidden = picker.style.display !== 'flex';
            picker.style.display = isHidden ? 'flex' : 'none';
            if (isHidden) renderEmojis();

            if (picker && picker.style.display === 'flex') {

        // Gestion des Notifications Web
        window.requestNotificationPermission = () => {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert("Notifications activées avec succès !");
                    } else if (permission === "denied") {
                        alert("Notifications refusées dans les paramètres de votre navigateur.");

            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(`Message de ${senderName}`, {

                    icon: "https://via.placeholder.com/128/5865f2/ffffff?text=BP"

                await update(uRef, { uid: myId, email: user.email.toLowerCase(), displayName: user.email.split('@')[0], status: "online" });

                document.getElementById('loginOverlay').classList.add('hidden');
                loadContacts(); loadRequests();
            } else { 
                document.getElementById('loginOverlay').classList.remove('hidden'); 
            }
        });

        window.toggleMenu = () => document.getElementById('sidePanels').classList.toggle('open');
        window.showHome = () => {
            document.getElementById('homePage').style.display = 'flex';
            document.getElementById('chatPage').style.display = 'none';
            document.getElementById('seeMoreOverlay').style.display = 'none';
            document.getElementById('sidePanels').classList.remove('open');
            activeChatId = null;
        };

        function loadContacts() {
            onValue(ref(db, `contacts/${myId}`), (snap) => {
                const iList = document.getElementById('iconsList'); iList.innerHTML = "";
                contactsData = [];
                snap.forEach(c => {
                    const fid = c.val().uid;
                    onValue(ref(db, `users/${fid}`), (uSnap) => {
                        const data = uSnap.val(); if(!data) return;
                        contactsData = contactsData.filter(u => u.uid !== fid);
                        contactsData.push(data);
                        
                        const icon = document.createElement('div');
                        icon.className = "contact-circle"; icon.innerText = data.displayName[0];
                        icon.onclick = () => openChat(fid, data.displayName);
                        iList.appendChild(icon);
                        refreshDashboard();
                        listenForNotifications(fid, data.displayName);
                    });
                });
            });

        function listenForNotifications(friendId, friendName) {
            const ids = [myId, friendId].sort();
            const chatId = ids[0] + "_" + ids[1];
            
            if (activeListeners.has(chatId)) return;
            activeListeners.add(chatId);

            let initialLoad = true;
            const chatRef = query(ref(db, `chats/${chatId}`), limitToLast(1));
            
            onValue(chatRef, (snap) => {
                if (initialLoad) {
                    initialLoad = false;
                    return;
                }
                snap.forEach(m => {
                    const msg = m.val();
                    if (msg.authorUid !== myId && (activeChatId !== chatId || document.hidden)) {
                        triggerNotification(friendName, msg.text);
                    }
                });
            });
        }

        function refreshDashboard() {
            const onArr = contactsData.filter(u => u.status === 'online');
            const offArr = contactsData.filter(u => u.status === 'offline');
            document.getElementById('onLabel').innerText = `En ligne (${onArr.length}) :`;
            document.getElementById('offLabel').innerText = `Hors ligne (${offArr.length}) :`;

            const cardHtml = (u) => `<div class="contact-card" onclick="openChat('${u.uid}', '${u.displayName}')"><div class="user-icon-wrap">${u.displayName[0]}<div class="status-dot ${u.status}"></div></div><div class="user-name-big">${u.displayName}</div></div>`;
            document.getElementById('onPreview').innerHTML = onArr.length ? cardHtml(onArr[0]) : "";
            document.getElementById('offPreview').innerHTML = offArr.length ? cardHtml(offArr[0]) : "";
        }

        window.openChat = (fid, fname) => {
            const ids = [myId, fid].sort();
            activeChatId = ids[0] + "_" + ids[1];
            document.getElementById('chatTitle').innerText = fname;
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('chatPage').style.display = 'flex';
            document.getElementById('seeMoreOverlay').style.display = 'none';
            document.getElementById('sidePanels').classList.remove('open');
            
            onValue(ref(db, `chats/${activeChatId}`), (snap) => {
                const mDiv = document.getElementById('messages'); mDiv.innerHTML = "";
                snap.forEach(m => {
                    const isMe = m.val().authorUid === myId;
                    const wrap = document.createElement('div');
                    wrap.style = `display:flex; flex-direction:column; max-width:100%; align-self:${isMe?'flex-end':'flex-start'}; align-items:${isMe?'flex-end':'flex-start'}`;
                    wrap.innerHTML = `<div class="bubble" oncontextmenu="showCtx(event, '${m.key}', ${isMe})" style="background:${isMe?'var(--msg-me)':'var(--msg-friend)'}; border-radius:18px; border-bottom-${isMe?'right':'left'}-radius:4px;">${m.val().text}</div>`;
                    mDiv.appendChild(wrap);
                });
                mDiv.scrollTop = mDiv.scrollHeight;
            });
        };

        window.openSeeMore = (type) => {
            const grid = document.getElementById('seeMoreGrid'); grid.innerHTML = "";
            document.getElementById('seeMoreOverlay').style.display = 'flex';
            document.getElementById('seeMoreTitle').innerText = type === 'online' ? "Amis en ligne" : "Amis hors ligne";
            contactsData.filter(c => c.status === type).forEach(c => {
                grid.innerHTML += `<div class="contact-card" onclick="openChat('${c.uid}', '${c.displayName}')"><div class="user-icon-wrap">${c.displayName[0]}<div class="status-dot ${c.status}"></div></div><div class="user-name-big">${c.displayName}</div></div>`;
            });
        };
        window.closeSeeMore = () => document.getElementById('seeMoreOverlay').style.display = 'none';

        function loadRequests() {
            onValue(ref(db, `requests/${myId}`), (snap) => {
                const rList = document.getElementById('requestsList'); rList.innerHTML = "";
                snap.forEach(c => {
                    rList.innerHTML += `<div style="padding:10px; background:#2b2d31; border-radius:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; font-size:13px;"><span>${c.val().fromName}</span><button onclick="acceptInvite('${c.key}')" style="background:var(--online); color:white; border:none; padding:5px 10px; border-radius:6px; cursor:pointer; font-weight:bold;">OK</button></div>`;
                });
            });
        }

        window.acceptInvite = async (fid) => {
            await set(ref(db, `contacts/${myId}/${fid}`), { uid: fid });
            await set(ref(db, `contacts/${fid}/${myId}`), { uid: myId });
            await remove(ref(db, `requests/${myId}/${fid}`));
        };

        window.sendMessage = () => {
            const val = document.getElementById('userInput').value.trim();
            if(val && activeChatId) push(ref(db, `chats/${activeChatId}`), { authorUid: myId, text: val });
            document.getElementById('userInput').value = "";
            hideEmojiPicker();
        };

        document.getElementById('loginBtn').onclick = () => {
            const e = document.getElementById('email').value.trim();
            const p = document.getElementById('pass').value;
            if(!e || !p) return alert("Veuillez remplir tous les champs.");
            signInWithEmailAndPassword(auth, e, p).catch(err => alert("Erreur de connexion : " + err.message));
        };

        document.getElementById('sendInviteBtn').onclick = async () => {
            const email = document.getElementById('friendEmail').value.trim().toLowerCase();
            const q = query(ref(db, 'users'), orderByChild('email'), equalTo(email));
            const snap = await get(q);
            if(snap.exists()){
                const tid = Object.keys(snap.val())[0];
                const me = await get(ref(db, `users/${myId}`));
                await set(ref(db, `requests/${tid}/${myId}`), { fromUid: myId, fromName: me.val().displayName });
                alert("Demande envoyée !"); document.getElementById('addModal').classList.add('hidden');
            } else alert("Utilisateur non trouvé.");
        };

        // Context Menu Functions
        window.showCtx = (e, mid, isMe) => { if(!isMe) return; e.preventDefault(); selectedMsgId = mid; const m = document.getElementById('ctxMenu'); m.style.display='block'; m.style.left=e.pageX+'px'; m.style.top=e.pageY+'px'; };
        window.hideCtx = () => document.getElementById('ctxMenu').style.display='none';
        window.deleteMsg = () => remove(ref(db, `chats/${activeChatId}/${selectedMsgId}`));
        window.editMsg = () => { const t = prompt("Nouveau message :"); if(t) update(ref(db, `chats/${activeChatId}/${selectedMsgId}`), { text: t + " (modifié)" }); };
    </script>
</body>
</html>
