<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application de Chat Moderne</title>
    <style>
        :root {
            --bg-main: #313338;
            --bg-side: #2b2d31;
            --bg-dark: #1e1f22;
            --text: #f2f3f5;
            --text-muted: #b5bac1;
            --msg-me: #5865f2;
            --msg-friend: #383a40;
            --online: #23a55a;
            --offline: #80848e;
            --accent: #5865f2;
            --danger: #f23f43;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-main); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        #sidePanels { width: 280px; background: var(--bg-side); display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.05); }
        .sidebar-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar-header h2 { font-size: 16px; font-weight: 600; }
        
        #iconsList { padding: 12px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        
        .contact-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .contact-item:hover { background: rgba(255,255,255,0.05); }
        
        .user-icon-wrap { position: relative; width: 38px; height: 38px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; flex-shrink: 0; }
        .status-dot { position: absolute; bottom: 0; right: 0; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--bg-side); }
        .status-dot.online { background: var(--online); }
        .status-dot.offline { background: var(--offline); }
        
        .contact-info { display: flex; flex-direction: column; overflow: hidden; }
        .contact-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .contact-status-text { font-size: 12px; color: var(--text-muted); }

        /* Main Content & Dashboard */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--bg-main); }
        
        #homePage { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .dashboard-section { background: var(--bg-side); padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.03); }
        .dashboard-section h4 { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Chat Area */
        #chatPage { display: none; flex-direction: column; height: 100%; }
        .chat-header { padding: 14px 20px; background: var(--bg-side); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
        
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .bubble-wrapper { display: flex; flex-direction: column; max-width: 75%; }
        .bubble-wrapper.me { align-self: flex-end; align-items: flex-end; }
        .bubble-wrapper.friend { align-self: flex-start; align-items: flex-start; }
        
        .bubble { padding: 10px 14px; word-break: break-word; font-size: 14px; line-height: 1.4; border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .bubble-wrapper.me .bubble { background: var(--msg-me); color: white; border-bottom-right-radius: 4px; }
        .bubble-wrapper.friend .bubble { background: var(--msg-friend); color: var(--text); border-bottom-left-radius: 4px; }
        
        .chat-input-area { padding: 16px; background: var(--bg-side); display: flex; gap: 10px; align-items: center; position: relative; border-top: 1px solid rgba(255,255,255,0.03); }
        
        /* UI Elements & Modals */
        input, button { outline: none; border: none; }
        input { background: var(--bg-dark); color: white; padding: 10px 14px; border-radius: 8px; width: 100%; font-size: 14px; border: 1px solid transparent; transition: border 0.2s; }
        input:focus { border-color: var(--accent); }
        
        button { background: var(--accent); color: white; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; transition: opacity 0.2s; }
        button:hover { opacity: 0.85; }

        .hidden { display: none !important; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-card { background: var(--bg-side); padding: 24px; border-radius: 14px; width: 90%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05); }

        /* Context Menu & Emoji Picker */
        #ctxMenu { position: fixed; background: var(--bg-dark); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 6px; display: none; z-index: 2000; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
        .ctx-item { padding: 8px 12px; font-size: 13px; cursor: pointer; border-radius: 6px; display: flex; align-items: center; gap: 8px; color: var(--text); }
        .ctx-item:hover { background: var(--accent); }

        #emojiPicker { position: absolute; bottom: 70px; left: 16px; width: 320px; height: 340px; background: var(--bg-dark); border-radius: 12px; display: none; flex-direction: column; padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 100; border: 1px solid rgba(255,255,255,0.05); }
        #emojiGrid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; font-size: 20px; text-align: center; margin-top: 8px; }
        .emoji-item { cursor: pointer; padding: 6px; border-radius: 6px; transition: background 0.1s; }
        .emoji-item:hover { background: var(--bg-side); }
    </style>
</head>

        window.renderEmojis = (filter = "") => {
            const grid = document.getElementById('emojiGrid');
            if(!grid) return;
            grid.innerHTML = "";
            const cleanFilter = filter.toLowerCase().trim();
            
            emojiList.forEach(item => {
                if (!cleanFilter || item.k.includes(cleanFilter) || item.e.includes(cleanFilter)) {
                    const span = document.createElement('span');
                    span.className = 'emoji-item';
                    span.innerText = item.e;
                    span.onclick = (e) => {
                        e.stopPropagation();
                        const input = document.getElementById('userInput');
                        input.value += item.e;
                        input.focus();
                    };
                    grid.appendChild(span);
                }
            });
        };

        window.filterEmojis = (val) => renderEmojis(val);

        window.toggleEmojiPicker = (e) => {
            e.stopPropagation();
            const picker = document.getElementById('emojiPicker');
            const isHidden = picker.style.display !== 'flex';
            picker.style.display = isHidden ? 'flex' : 'none';
            if (isHidden) renderEmojis();
        };

        window.hideEmojiPicker = () => {
            const picker = document.getElementById('emojiPicker');
            if (picker && picker.style.display === 'flex') {
                picker.style.display = 'none';
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                myId = user.uid;
                const uRef = ref(db, `users/${myId}`);
                await update(uRef, { uid: myId, email: user.email.toLowerCase(), displayName: user.email.split('@')[0], status: "online" });
                onDisconnect(uRef).update({ status: "offline" });
                document.getElementById('loginOverlay').classList.add('hidden');
                loadContacts(); 
                loadRequests();
            } else { 
                document.getElementById('loginOverlay').classList.remove('hidden'); 
            }
        });

        window.showHome = () => {
            document.getElementById('homePage').style.display = 'flex';
            document.getElementById('chatPage').style.display = 'none';
            activeChatId = null;
        };

        function loadContacts() {
            onValue(ref(db, `contacts/${myId}`), (snap) => {
                const iList = document.getElementById('iconsList'); 
                iList.innerHTML = "";
                contactsData = [];
                snap.forEach(c => {
                    const fid = c.val().uid;
                    onValue(ref(db, `users/${fid}`), (uSnap) => {
                        const data = uSnap.val(); 
                        if(!data) return;
                        contactsData = contactsData.filter(u => u.uid !== fid);
                        contactsData.push(data);
                        
                        const item = document.createElement('div');
                        item.className = "contact-item"; 
                        item.innerHTML = `
                            <div class="user-icon-wrap">${data.displayName[0].toUpperCase()}<div class="status-dot ${data.status}"></div></div>
                            <div class="contact-info">
                                <span class="contact-name">${data.displayName}</span>
                                <span class="contact-status-text">${data.status === 'online' ? 'En ligne' : 'Hors ligne'}</span>
                            </div>
                        `;
                        item.onclick = () => openChat(fid, data.displayName);
                        iList.appendChild(item);
                        refreshDashboard();
                    });
                });
            });
        }

        function refreshDashboard() {
            const onArr = contactsData.filter(u => u.status === 'online');
            const offArr = contactsData.filter(u => u.status === 'offline');
            document.getElementById('onLabel').innerText = `En ligne (${onArr.length})`;
            document.getElementById('offLabel').innerText = `Hors ligne (${offArr.length})`;

            const renderCard = (u) => `
                <div class="contact-item" onclick="openChat('${u.uid}', '${u.displayName}')" style="background:var(--bg-dark);">
                    <div class="user-icon-wrap">${u.displayName[0].toUpperCase()}<div class="status-dot ${u.status}"></div></div>
                    <div class="contact-info">
                        <span class="contact-name">${u.displayName}</span>
                    </div>
                </div>`;
            
            document.getElementById('onPreview').innerHTML = onArr.map(renderCard).join('') || "<p style='font-size:12px; color:var(--text-muted);'>Aucun ami en ligne</p>";

            const ids = [myId, fid].sort();
            activeChatId = ids[0] + "_" + ids[1];
            document.getElementById('chatTitle').innerText = fname;
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('chatPage').style.display = 'flex';
            
            onValue(ref(db, `chats/${activeChatId}`), (snap) => {
                const mDiv = document.getElementById('messages'); 
                mDiv.innerHTML = "";
                snap.forEach(m => {
                    const val = m.val();
                    const isMe = val.authorUid === myId;
                    const wrapper = document.createElement('div');
                    wrapper.className = `bubble-wrapper ${isMe ? 'me' : 'friend'}`;
                    
                    let reactionsHtml = "";
                    if (val.reactions) {
                        const counts = {};
                        Object.values(val.reactions).forEach(r => counts[r] = (counts[r] || 0) + 1);
                        const badges = Object.entries(counts).map(([r, c]) => `${r}${c > 1 ? ' '+c : ''}`).join(' ');
                        reactionsHtml = `<div style="font-size:11px; background:var(--bg-dark); border-radius:10px; padding:2px 6px; margin-top:2px; border:1px solid rgba(255,255,255,0.08);">${badges}</div>`;
                    }

                    const safeText = (val.text || "").replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');

                    wrapper.innerHTML = `
                        <div class="bubble" oncontextmenu="showCtx(event, '${m.key}', ${isMe}, '${safeText}')">${val.text}</div>
                        ${reactionsHtml}
                    `;
                    mDiv.appendChild(wrapper);
                });
                mDiv.scrollTop = mDiv.scrollHeight;
            });
        };

        function loadRequests() {
            onValue(ref(db, `requests/${myId}`), (snap) => {
                const rList = document.getElementById('requestsList'); 
                if(!rList) return;
                rList.innerHTML = "";
                if (!snap.exists()) {

                snap.forEach(c => {

                        </div>`;
                });
            });
        }

        window.acceptInvite = async (fid) => {
            try {
                await set(ref(db, `contacts/${myId}/${fid}`), { uid: fid });
                await set(ref(db, `contacts/${fid}/${myId}`), { uid: myId });
                await remove(ref(db, `requests/${myId}/${fid}`));
            } catch (err) {
                console.error("Erreur :", err);

            const val = document.getElementById('userInput').value.trim();

        window.closeAddModal = () => {

            const e = document.getElementById('email').value.trim();
            const p = document.getElementById('pass').value;
            if(!e || !p) return alert("Remplis tous les champs.");
            signInWithEmailAndPassword(auth, e, p).catch(err => alert("Erreur : " + err.message));
        };

        document.getElementById('sendInviteBtn').onclick = async (e) => {
            if (e) e.preventDefault();
            const emailInput = document.getElementById('friendEmail');
            const email = emailInput.value.trim().toLowerCase();
            
            if(!email) return alert("Entre un email.");

            try {
                const q = query(ref(db, 'users'), orderByChild('email'), equalTo(email));
                const snap = await get(q);

                if(snap.exists()){
                    const tid = Object.keys(snap.val())[0];
                    if(tid === myId) return alert("Impossible de t'ajouter toi-même.");
                    
                    const me = await get(ref(db, `users/${myId}`));
                    const myName = (me.exists() && me.val().displayName) ? me.val().displayName : "Quelqu'un";

                    await set(ref(db, `requests/${tid}/${myId}`), { fromUid: myId, fromName: myName });
                    alert("Demande envoyée !"); 
                    closeAddModal();
                } else {
                    alert("Utilisateur introuvable.");
                }
            } catch (err) {
                alert("Erreur : " + err.message);
            }
        };

        window.showCtx = (e, mid, isMe, text) => { 
            e.preventDefault(); 
            selectedMsgId = mid; 
            selectedMsgText = text;

            const m = document.getElementById('ctxMenu'); 
            document.getElementById('ctxEdit').style.display = isMe ? 'flex' : 'none';
            document.getElementById('ctxDelete').style.display = isMe ? 'flex' : 'none';

            m.style.display = 'block';
            let posX = Math.min(e.clientX, window.innerWidth - 180);
            let posY = Math.min(e.clientY, window.innerHeight - 150);

            m.style.left = posX + 'px'; 
            m.style.top = posY + 'px'; 
        };

        window.hideCtx = () => {
            const m = document.getElementById('ctxMenu');
            if(m) m.style.display = 'none';
        };
        
        window.copyMsg = () => {
            if (selectedMsgText) navigator.clipboard.writeText(selectedMsgText);
            hideCtx();
        };

        window.addReaction = (emoji) => {
            if (selectedMsgId && activeChatId) {
                set(ref(db, `chats/${activeChatId}/${selectedMsgId}/reactions/${myId}`), emoji);
            }
            hideCtx();
        };

        window.deleteMsg = () => {
            if(selectedMsgId && activeChatId) remove(ref(db, `chats/${activeChatId}/${selectedMsgId}`));
            hideCtx();
        };
        
        window.editMsg = () => { 
            const t = prompt("Modifier le message :", selectedMsgText); 
            if(t !== null && selectedMsgId && activeChatId) {
                update(ref(db, `chats/${activeChatId}/${selectedMsgId}`), { text: t + " (modifié)" }); 
            }
            hideCtx();
        };
    </script>
</body>
</html>
